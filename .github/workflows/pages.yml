name: Publier le mini-site sur GitHub Pages

# Lancement manuel après validation : aucun déploiement sur push ou pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v6
      - name: Préparer Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier le code
        run: npm run lint
      - name: Exécuter les tests
        run: npm test
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Construire le mini-site de téléchargement
        run: npm run build:pages
      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier les fichiers validés
        id: deployment
        uses: actions/deploy-pages@v4
